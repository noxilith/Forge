[package]
name = "forge-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
forge-build = { version = "0.1.0", path = "../forge-build" }
forge-core = { version = "0.1.0", path = "../forge-core" }
forge-store = { version = "0.1.0", path = "../forge-store" }
libc = "0.2.191"
toml = "1.2.0"

[dev-dependencies]
tempfile = "3.27.0"
